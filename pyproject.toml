[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "control-production-plane"
version = "0.1.0a1"
description = "Durable local coordination records for software production tasks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "kongbu0621"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3.12"]

[project.scripts]
production-plane = "control_production_plane.cli:main"

[project.urls]
Repository = "https://github.com/kongbu0621/control-production-plane"

[tool.setuptools.packages.find]
where = ["src"]
